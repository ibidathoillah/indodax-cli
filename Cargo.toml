[package]
name = "indodax-cli"
version = "0.1.0"
edition = "2021"
description = "A command-line interface for the Indodax cryptocurrency exchange"
license = "MIT"
repository = "https://github.com/btcid/indodax-cli"

[[bin]]
name = "indodax"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["__rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
url = "2"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", features = ["sink"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
comfy-table = "7"
dialoguer = "0.11"
rustyline = "17"
colored = "3"
indicatif = "0.17"
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tempfile = "3"
